# App Name
spring.application.name=shopping-bot

# Database settings - Saves to a folder named 'data' in your project
spring.datasource.url=jdbc:h2:file:./data/shopping_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Update database schema automatically
spring.jpa.hibernate.ddl-auto=update

# Access the DB UI at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Update database schema automatically
SPRING_JPA_HIBERNATE_DDL_AUTO=update

# Session: persist in DB so restarts don't log users out
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=2592000s

# 30-day persistent cookie (survives browser close)
server.servlet.session.timeout=2592000
server.servlet.session.cookie.max-age=2592000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax