# App Name
spring.application.name=shopping-bot

# Database settings - Saves to a folder named 'data' in your project
spring.datasource.url=jdbc:h2:file:./data/shopping_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Update database schema automatically
spring.jpa.hibernate.ddl-auto=update

# Access the DB UI at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Update database schema automatically
SPRING_JPA_HIBERNATE_DDL_AUTO=update