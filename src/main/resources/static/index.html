<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family">
  <meta name="theme-color" content="#059669">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <title>Family App</title>
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen" class="screen hidden">
    <div class="auth-box">
      <div class="auth-mark">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </div>
      <h1 id="auth-title">Family App</h1>
      <p id="auth-subtitle">Sign in to continue</p>
      <div id="signin-button"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app-screen" class="screen hidden">
    <header>
      <span id="header-title">Family App</span>
      <div class="header-right">
        <button id="lang-btn" class="icon-btn" title="Toggle language">עב</button>
        <img id="user-avatar" src="" alt="" class="avatar">
        <button id="signout-btn" class="icon-btn" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="shopping">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="tab-label" data-key="shopping">Shopping</span>
      </button>
      <button class="tab-btn" data-tab="vouchers">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span class="tab-label" data-key="vouchers">Vouchers</span>
      </button>
    </nav>

    <!-- Shopping tab -->
    <div id="pane-shopping" class="pane active">
      <div class="add-row">
        <input id="item-input" type="text" data-placeholder-key="addItem" placeholder="Add item…" autocomplete="off">
        <button id="add-item-btn" class="add-btn" aria-label="Add item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <ul id="shopping-list" class="item-list"></ul>
      <div class="pane-footer">
        <button id="clear-btn" class="ghost-danger-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          <span data-key="clearAll">Clear all</span>
        </button>
      </div>
    </div>

    <!-- Vouchers tab -->
    <div id="pane-vouchers" class="pane hidden">
      <div class="voucher-toolbar">
        <button id="refresh-btn" class="secondary-btn">
          <span id="refresh-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          </span>
          <span data-key="refreshBalances">Refresh balances</span>
        </button>
      </div>
      <div id="vouchers-list"></div>
      <div class="pane-footer">
        <details id="add-voucher-details">
          <summary data-key="addVoucher">+ Add voucher</summary>
          <form id="add-voucher-form" class="voucher-form">
            <input name="provider" type="text" data-placeholder-key="provider" placeholder="Provider" required>
            <input name="voucherNumber" type="text" data-placeholder-key="voucherNumber" placeholder="Voucher number" required>
            <input name="amount" type="number" step="0.01" data-placeholder-key="amount" placeholder="Amount (₪)" required>
            <input name="expiryDate" type="date" required>
            <input name="vendor" type="text" data-placeholder-key="vendor" placeholder="Vendor (optional)">
            <input name="remarks" type="text" data-placeholder-key="remarks" placeholder="Remarks (optional)">
            <button type="submit" class="primary-btn" data-key="save">Save</button>
          </form>
        </details>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Confirm dialog -->
  <div id="overlay" class="overlay hidden">
    <div class="dialog">
      <p id="dialog-msg"></p>
      <div class="dialog-btns">
        <button id="dialog-cancel" class="secondary-btn" data-key="cancel">Cancel</button>
        <button id="dialog-confirm" class="danger-btn" data-key="confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script src="https://accounts.google.com/gsi/client" onload="initApp()"></script>
</body>
</html>
